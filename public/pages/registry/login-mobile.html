<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISWA</title>

    <!-- FavIcons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/public/images/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/public/images/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/images/favicons/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- CSS Imports-->
    <link rel="stylesheet" href="/src/css/base.css">
    <link rel="stylesheet" href="/src/css/registry/registry -mobile.css">

    <!-- External Imports -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <main>
        <div class="blob-layer">
            <div id="blob-up-left-solid"></div>
            <div id="blob-up-right-outline"></div>
            <div id="blob-down-left-solid"></div>
            <div id="blob-down-left-outline"></div>
            <div id="blob-down-right-solid"></div>
        </div>

        <section class="login-container">
            <img src="/public/images/GradCap2.png" alt="SISWA Logo" class="logo">
            <h1><b><i>LOGIN</i></b></h1>
            <form class="form" action="login" method="post">
                <input type="email" id="email" name="email" placeholder="Alamat email" required>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Kata sandi" name="password" required>
                    <i class="fa-solid fa-eye-slash toggle-password" data-target="password"></i>
                </div>

                <div id="forgot-password-container">
                    <a href="#" id="forgot-password">Lupa Kata Sandi?</a>
                </div>

                <button type="submit" class="btn-primary">Masuk</button>
            </form>

            <div class="separator">
                <h2>Atau login dengan</h2>
            </div>
        </section>

        <section class="options">
            <img class="logo2" src="/public/images/SISWA_white.png" alt="">
            <h1 class="slogan">Jadikan impian kuliahmu nyata!</h1>

            <div class="social-mobile-version">
                <button id="google">
                    <i class="fa-brands fa-google"></i>
                </button>
                <button id="facebook">
                    <i class="fa-brands fa-facebook"></i>
                </button>
            </div>

            <div class="social-desktop-version">
                <button id="google">
                    <i class="fa-brands fa-google"></i>
                    Masuk dengan Google
                </button>
                <button id="facebook">
                    <i class="fa-brands fa-facebook"></i>
                    Masuk dengan Facebook
                </button>
            </div>

            <div class="separator-desktop">
                <h2>Belum punya akun?</h2>
            </div>

            <button class="Daftar" href="#">Daftar Sekarang</button>
        </section>
    </main>

    <script src=" /src/js/registry.js"></script>
</body>

</html>
